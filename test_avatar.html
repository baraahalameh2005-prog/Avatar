<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Avatar Test</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #eeeeee;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

<script type="module">

    import * as THREE from "three";

    import {
        GLTFLoader
    } from "three/addons/loaders/GLTFLoader.js";

    import {
        OrbitControls
    } from "three/addons/controls/OrbitControls.js";


    // ===============================
    // SCENE
    // ===============================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xeeeeee);


    // ===============================
    // CAMERA
    // ===============================

    const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
    );

    camera.position.set(2, 1.2, 2.5);


    // ===============================
    // RENDERER
    // ===============================

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        window.devicePixelRatio
    );

    document.body.appendChild(
        renderer.domElement
    );


    // ===============================
    // LIGHTING
    // ===============================

    const light = new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

    scene.add(light);


    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directionalLight.position.set(
        3,
        5,
        3
    );

    scene.add(directionalLight);


    // ===============================
    // ORBIT CONTROLS
    // ===============================

    const controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.target.set(
        0,
        0.8,
        0
    );

    controls.update();


    // ===============================
    // LOAD AVATAR
    // ===============================

    const loader =
        new GLTFLoader();


    loader.load(

        // Avatar generated by FastAPI
        "/models/generated_avatar.glb",

        (gltf) => {

            console.log(
                "Avatar loaded successfully!"
            );

            const avatar =
                gltf.scene;

            scene.add(avatar);

            console.log(
                "Avatar:",
                avatar
            );
        },

        undefined,

        (error) => {

            console.error(
                "Failed to load avatar:",
                error
            );
        }
    );


    // ===============================
    // WINDOW RESIZE
    // ===============================

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }
    );


    // ===============================
    // ANIMATION LOOP
    // ===============================

    function animate() {

        requestAnimationFrame(
            animate
        );

        controls.update();

        renderer.render(
            scene,
            camera
        );
    }


    animate();

</script>

</body>
</html>
